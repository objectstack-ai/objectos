services:
  objectos:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/objectstack-ai/objectos:dev
    container_name: objectos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      OS_CLOUD_URL: ${OS_CLOUD_URL:-}
      OS_PROJECT_ID: ${OS_PROJECT_ID:-}
      OS_ARTIFACT_FILE: ${OS_ARTIFACT_FILE:-}
      OS_BUSINESS_DB_URL: ${OS_BUSINESS_DB_URL:-file:/var/lib/objectos/data.db}
    volumes:
      - objectos-cache:/var/cache/objectos
      - objectos-data:/var/lib/objectos

volumes:
  objectos-cache:
  objectos-data:
