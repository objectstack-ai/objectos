<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ObjectOS Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --panel: #141826;
        --fg: #e6e8ee;
        --muted: #8b93a7;
        --line: #232a3d;
        --accent: #6ea8ff;
        --danger: #ff6e6e;
        --ok: #5dd39e;
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px 8px;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      main {
        flex: 1;
        overflow: auto;
        padding: 16px 20px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1.4fr auto;
        gap: 8px;
        margin-bottom: 6px;
        align-items: center;
      }
      .row.header {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 8px;
      }
      input {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 10px;
        font: inherit;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      input.shell-overridden {
        border-style: dashed;
        color: var(--muted);
      }
      .key-input { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .del {
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 6px 9px;
        cursor: pointer;
        font: inherit;
      }
      .del:hover { color: var(--danger); border-color: var(--line); }
      .hint {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 11px;
        margin: -2px 0 6px 2px;
      }
      .add-btn {
        background: transparent;
        color: var(--accent);
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 8px;
        width: 100%;
        cursor: pointer;
        font: inherit;
        margin-top: 4px;
      }
      .add-btn:hover { border-color: var(--accent); }
      .presets {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .presets button {
        background: var(--panel);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
        margin: 0 4px 4px 0;
        cursor: pointer;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .presets button:hover { border-color: var(--accent); color: var(--accent); }
      footer {
        padding: 12px 20px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      footer .path {
        color: var(--muted);
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
        flex: 1;
      }
      .actions { display: flex; gap: 8px; flex-shrink: 0; }
      button.primary {
        background: var(--accent);
        color: #08101e;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      button.primary:hover { filter: brightness(1.08); }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      button.secondary:hover { border-color: var(--accent); }
      .toast {
        position: fixed;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .toast.show { opacity: 1; }
      .toast.ok { border-color: var(--ok); color: var(--ok); }
      .toast.err { border-color: var(--danger); color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <h1>Environment variables</h1>
      <p>Any variable here is passed to the ObjectOS server on next start. Reserved keys (<code>PORT</code>, <code>HOST</code>, <code>OBJECTOS_HOME</code>) are honored — others are forwarded as-is.</p>
    </header>
    <main>
      <div class="row header">
        <span>KEY</span>
        <span>VALUE</span>
        <span></span>
      </div>
      <div id="rows"></div>
      <button class="add-btn" id="add">+ Add variable</button>

      <div class="presets">
        Quick add:
        <button data-key="PORT" data-val="3000">PORT</button>
        <button data-key="HOST" data-val="0.0.0.0">HOST=0.0.0.0 (LAN)</button>
        <button data-key="OBJECTOS_HOME" data-val="">OBJECTOS_HOME</button>
        <button data-key="LOG_LEVEL" data-val="debug">LOG_LEVEL</button>
      </div>

      <div class="presets" style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="autostart" />
          <span>Launch ObjectOS at login</span>
        </label>
      </div>
    </main>
    <footer>
      <span class="path" id="path"></span>
      <div class="actions">
        <button class="secondary" id="cancel">Close</button>
        <button class="primary" id="save">Save &amp; restart</button>
      </div>
    </footer>
    <div class="toast" id="toast"></div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const rowsEl = document.getElementById("rows");
      const pathEl = document.getElementById("path");
      const toastEl = document.getElementById("toast");
      let shellOverrides = {};

      function toast(msg, kind) {
        toastEl.textContent = msg;
        toastEl.className = "toast show " + (kind || "");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => (toastEl.className = "toast"), 1800);
      }

      function makeRow(key, value) {
        const row = document.createElement("div");
        row.className = "row";
        const overridden = key && Object.prototype.hasOwnProperty.call(shellOverrides, key);
        row.innerHTML = `
          <input class="key-input" placeholder="KEY" value="${escapeAttr(key)}" />
          <input class="val-input ${overridden ? "shell-overridden" : ""}" placeholder="value" value="${escapeAttr(value)}" ${overridden ? `title="Overridden by parent shell: ${escapeAttr(shellOverrides[key])}"` : ""} />
          <button class="del" title="Remove">✕</button>
        `;
        const [kIn, vIn, del] = row.children;
        del.onclick = () => {
          row.remove();
          maybeShowOverrideHint(row, kIn.value);
        };
        kIn.oninput = () => {
          const k = kIn.value.trim();
          vIn.classList.toggle("shell-overridden", !!shellOverrides[k]);
          vIn.title = shellOverrides[k]
            ? `Overridden by parent shell: ${shellOverrides[k]}`
            : "";
        };
        rowsEl.appendChild(row);
        return row;
      }

      function maybeShowOverrideHint() { /* placeholder for future */ }

      function escapeAttr(s) {
        return String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      function collect() {
        const out = {};
        for (const row of rowsEl.children) {
          const [k, v] = row.children;
          const key = k.value.trim();
          if (!key) continue;
          out[key] = v.value;
        }
        return out;
      }

      async function load() {
        const snap = await invoke("get_config_snapshot");
        shellOverrides = snap.shell_overrides || {};
        pathEl.textContent = snap.config_path;
        rowsEl.innerHTML = "";
        const entries = Object.entries(snap.env || {});
        if (entries.length === 0) makeRow("", "");
        else for (const [k, v] of entries) makeRow(k, v);
      }

      document.getElementById("add").onclick = () => {
        const row = makeRow("", "");
        row.querySelector(".key-input").focus();
      };

      document.querySelectorAll(".presets button").forEach((btn) => {
        btn.onclick = () => {
          const k = btn.dataset.key;
          const v = btn.dataset.val;
          // Replace existing row with same key, else append.
          for (const row of rowsEl.children) {
            if (row.children[0].value.trim() === k) {
              row.children[1].value = v;
              row.children[1].focus();
              return;
            }
          }
          const row = makeRow(k, v);
          row.querySelector(".val-input").focus();
        };
      });

      document.getElementById("cancel").onclick = () => window.close();

      document.getElementById("save").onclick = async () => {
        const env = collect();
        try {
          await invoke("save_config", { env });
          await invoke("restart_runtime");
          toast("Saved. Runtime restarting…", "ok");
          setTimeout(() => window.close(), 700);
        } catch (e) {
          toast(String(e), "err");
        }
      };

      load().catch((e) => toast("Load failed: " + e, "err"));

      const autostartEl = document.getElementById("autostart");
      invoke("autostart_get")
        .then((on) => (autostartEl.checked = !!on))
        .catch(() => {});
      autostartEl.addEventListener("change", async () => {
        try {
          const on = await invoke("autostart_set", { enabled: autostartEl.checked });
          autostartEl.checked = !!on;
          toast(on ? "Will launch at login" : "Login launch disabled", "ok");
        } catch (e) {
          toast("Autostart failed: " + e, "err");
          autostartEl.checked = !autostartEl.checked;
        }
      });
    </script>
  </body>
</html>
