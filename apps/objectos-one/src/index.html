<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ObjectOS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --fg: #e6e8ee;
        --muted: #8b93a7;
        --accent: #6ea8ff;
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(1200px 600px at 50% -10%, #1c2336 0%, var(--bg) 60%);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        display: grid;
        place-items: center;
        -webkit-user-select: none;
      }
      .wrap { width: min(560px, 88vw); text-align: center; }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .tag { color: var(--muted); margin-bottom: 28px; }
      .bar {
        height: 4px; border-radius: 4px; background: #1b2030; overflow: hidden;
        position: relative; margin: 0 auto 22px; width: 220px;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0; width: 35%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.6s linear infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }
      .log {
        margin: 0 auto; max-height: 220px; overflow: auto; text-align: left;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px; padding: 10px 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      .log div { white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">ObjectOS</div>
      <div class="tag">Starting local runtime…</div>
      <div class="bar"></div>
      <div id="log" class="log"></div>
    </div>
    <script>
      const log = document.getElementById('log');
      const append = (line) => {
        const el = document.createElement('div');
        el.textContent = line;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      };
      if (window.__TAURI__) {
        const { event } = window.__TAURI__;
        event.listen('objectos://log', (e) => append(String(e.payload)));
        event.listen('objectos://ready', (e) => {
          append('✓ ready, opening ' + e.payload);
        });
      } else {
        append('(Tauri bridge unavailable — running in plain browser)');
      }
    </script>
  </body>
</html>
