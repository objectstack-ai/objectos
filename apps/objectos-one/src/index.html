<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ObjectOS</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0d12;
        --fg: #e6e8ee;
        --muted: #8b93a7;
        --accent: #6ea8ff;
      }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(1200px 600px at 50% -10%, #1c2336 0%, var(--bg) 60%);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        display: grid;
        place-items: center;
        -webkit-user-select: none;
      }
      .wrap { width: min(560px, 88vw); text-align: center; }
      .logo {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .tag { color: var(--muted); margin-bottom: 28px; }
      .bar {
        height: 4px; border-radius: 4px; background: #1b2030; overflow: hidden;
        position: relative; margin: 0 auto 22px; width: 220px;
      }
      .bar::after {
        content: ""; position: absolute; inset: 0; width: 35%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.6s linear infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(380%); } }
      .log {
        margin: 0 auto; max-height: 220px; overflow: auto; text-align: left;
        background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px; padding: 10px 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
      }
      .log div { white-space: pre-wrap; word-break: break-all; }

      .update {
        margin: 0 auto 18px;
        max-width: 460px;
        padding: 14px 18px;
        background: linear-gradient(135deg, rgba(110,168,255,0.16), rgba(110,168,255,0.06));
        border: 1px solid rgba(110,168,255,0.32);
        border-radius: 12px;
        text-align: left;
      }
      .update-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; color: var(--fg); }
      .update-body  { color: var(--muted); font-size: 12px; line-height: 1.55; margin-bottom: 12px; max-height: 80px; overflow: auto; }
      .update-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .update-status  { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .btn {
        font: inherit; font-size: 12px; font-weight: 500;
        padding: 6px 14px; border-radius: 6px; cursor: pointer;
        border: 1px solid transparent; transition: all 0.15s;
      }
      .btn.primary { background: var(--accent); color: #0b0d12; }
      .btn.primary:hover:not(:disabled) { filter: brightness(1.1); }
      .btn.ghost   { background: transparent; color: var(--muted); border-color: rgba(255,255,255,0.12); }
      .btn.ghost:hover:not(:disabled)   { color: var(--fg); border-color: rgba(255,255,255,0.24); }
      .btn:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">ObjectOS</div>
      <div class="tag">Starting local runtime…</div>
      <div class="bar"></div>
      <div id="update" class="update" hidden>
        <div class="update-title">Update available: v<span id="upd-version"></span></div>
        <div class="update-body" id="upd-notes"></div>
        <div class="update-actions">
          <button id="upd-later" class="btn ghost">Later</button>
          <button id="upd-install" class="btn primary">Install &amp; Restart</button>
        </div>
        <div id="upd-status" class="update-status"></div>
      </div>
      <div id="fatal" class="update" hidden style="border-color:rgba(255,110,110,0.4);background:linear-gradient(135deg,rgba(255,110,110,0.14),rgba(255,110,110,0.04))">
        <div class="update-title" id="fatal-title">Runtime failed to start</div>
        <div class="update-body" id="fatal-body"></div>
        <div class="update-actions">
          <button id="fatal-logs" class="btn ghost">Reveal logs</button>
          <button id="fatal-retry" class="btn primary">Retry</button>
        </div>
      </div>
      <div id="log" class="log"></div>
    </div>
    <script>
      const log = document.getElementById('log');
      const append = (line) => {
        const el = document.createElement('div');
        el.textContent = line;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
      };

      const updateBox = document.getElementById('update');
      const updVersion = document.getElementById('upd-version');
      const updNotes = document.getElementById('upd-notes');
      const updStatus = document.getElementById('upd-status');
      const updInstall = document.getElementById('upd-install');
      const updLater = document.getElementById('upd-later');

      if (window.__TAURI__) {
        const { event, core } = window.__TAURI__;
        event.listen('objectos://log', (e) => append(String(e.payload)));
        event.listen('objectos://ready', (e) => {
          append('✓ ready, opening ' + e.payload);
        });
        event.listen('objectos://update-available', (e) => {
          const info = e.payload || {};
          updVersion.textContent = info.version || '?';
          updNotes.textContent = info.notes ? info.notes.slice(0, 240) : '';
          updateBox.hidden = false;
        });
        event.listen('objectos://update-installing', (e) => {
          updStatus.textContent = 'Downloading v' + e.payload + '…';
          updInstall.disabled = true;
          updLater.disabled = true;
        });
        event.listen('objectos://update-progress', (e) => {
          const p = e.payload || {};
          updStatus.textContent =
            p.pct != null ? 'Downloading ' + p.pct + '%…' : 'Downloading…';
        });
        updInstall.addEventListener('click', async () => {
          updStatus.textContent = 'Starting update…';
          updInstall.disabled = true;
          try {
            await core.invoke('install_update');
          } catch (err) {
            updStatus.textContent = 'Update failed: ' + err;
            updInstall.disabled = false;
            updLater.disabled = false;
          }
        });
        updLater.addEventListener('click', () => {
          updateBox.hidden = true;
        });

        const fatalBox = document.getElementById('fatal');
        const fatalBody = document.getElementById('fatal-body');
        event.listen('objectos://sidecar-fatal', (e) => {
          fatalBody.textContent = String(e.payload || 'Unknown error');
          fatalBox.hidden = false;
        });
        document.getElementById('fatal-logs').addEventListener('click', () => {
          core.invoke('reveal_logs').catch((err) => append('reveal_logs failed: ' + err));
        });
        document.getElementById('fatal-retry').addEventListener('click', () => {
          fatalBox.hidden = true;
          core.invoke('restart_runtime').catch((err) => append('restart failed: ' + err));
        });
      } else {
        append('(Tauri bridge unavailable — running in plain browser)');
      }
    </script>
  </body>
</html>
